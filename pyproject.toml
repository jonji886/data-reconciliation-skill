[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-csv-reconciliation-skill"
version = "0.1.0"
description = "Deterministic Excel/CSV reconciliation with explainable mapping suggestions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1",
  "pandas>=2.1,<3.0",
  "numpy>=2.0,<2.3",
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
reconcile = "reconcile_skill.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
